name: ci

# Everything that must stay green before a release tag is worth cutting.
# The unit suite is hermetic: no GPU, no ffmpeg, no network.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  test:
    name: core tests + i18n
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-test

      - name: flow-core unit tests
        run: cargo test -p flow-core --verbose

      - name: EN/FA key coverage
        run: node tools/check-i18n.mjs

  build:
    name: release build (app + wizard)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-build

      - name: Install frontend deps
        run: npm ci

      # The wizard embeds the engine with include_bytes!, so it cannot even compile
      # without the pack. Same source of truth as release.yml.
      - name: Fetch the pinned RIFE pack
        shell: bash
        run: |
          git fetch --depth 1 origin refs/heads/engine-pack:refs/remotes/origin/engine-pack
          git checkout origin/engine-pack -- setup/src-tauri/payload
          node tools/verify-payload.mjs

      - name: Compile the app for release (no bundling)
        run: npm run build -- --no-bundle

      # --no-bundle means there is no NSIS installer to embed, and the wizard
      # include_bytes!s one. A labelled stub is enough to prove the wizard still
      # compiles; release.yml is the only workflow that ships a real payload.
      # generate_context! also needs the assembled frontend, so build it first.
      - name: Compile the setup wizard for release
        run: |
          node setup/tools/build.mjs
          node -e "const fs=require('fs');const v=require('./src-tauri/tauri.conf.json').version;const f='setup/src-tauri/payload/flow_'+v+'_x64-setup.exe';fs.mkdirSync('setup/src-tauri/payload',{recursive:true});if(!fs.existsSync(f)){fs.writeFileSync(f,'CI compile stub - not an installer, never shipped.');console.log('stub:',f)}else{console.log('real payload already present')}"
          cargo build -p flow-setup --release --features custom-protocol
